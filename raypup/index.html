<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Platonic Dual Resonance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: arial;
        }

        #header {
            width: 100%;
            height: 60px;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        #logo {
            width: 44px;
            height: 44px;
            background-image: url('logo.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .spinner {
            height: 24px;
            width: 24px;
            margin-left: 16px;
            flex-shrink: 0;
            animation: rotation 0.8s linear infinite;
            border-left: 4px solid #555;
            border-right: 4px solid #555;
            border-bottom: 4px solid #555;
            border-top: 4px solid #ff4444;
            border-radius: 100%;
            background-color: #f5f5f5;
        }

        @keyframes rotation {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #status {
            margin-left: 16px;
            font-weight: bold;
            color: #ffffff;
            font-size: 14px;
        }

        #progress {
            height: 0;
            width: 0;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 60px);
            background-color: #1a1a1a;
            overflow: hidden;
        }

        canvas.emscripten {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
            display: block;
        }
    </style>
</head>
<body>
    <div id="header">
        <a href="https://victorberdugo1.github.io/" id="logo"></a>
        <div class="spinner" id="spinner"></div>
        <div id="status">Downloading...</div>
        <progress hidden id="progress" max="100" value="0"></progress>
    </div>

    <div id="canvas-container">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <script>
        var statusElement = document.getElementById('status');
        var progressElement = document.getElementById('progress');
        var spinnerElement = document.getElementById('spinner');

        function resizeToContainer() {
            var container = document.getElementById('canvas-container');
            var w = container.clientWidth  | 0;
            var h = container.clientHeight | 0;
            if (w <= 0 || h <= 0) return;
            if (typeof Browser !== 'undefined' && Browser.setCanvasSize) {
                Browser.setCanvasSize(w, h);
            }
        }

        window.addEventListener('resize', resizeToContainer);

        var Module = {
            preRun: [],
            postRun: [function() {
                requestAnimationFrame(resizeToContainer);
            }],
            print: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            },
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;

                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return;

                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;

                if (m) {
                    text = m[1];
                    progressElement.value = parseInt(m[2]) * 100;
                    progressElement.max = parseInt(m[4]) * 100;
                    progressElement.hidden = false;
                    spinnerElement.hidden = false;
                } else {
                    progressElement.value = null;
                    progressElement.max = null;
                    progressElement.hidden = true;
                    if (!text) spinnerElement.style.display = 'none';
                }
                statusElement.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        Module.setStatus('Downloading...');

        window.onerror = function() {
            Module.setStatus('Exception thrown, see JavaScript console');
            spinnerElement.style.display = 'none';
            Module.setStatus = function(text) {
                if (text) Module.printErr('[post-exception status] ' + text);
            };
        };
    </script>
    <script async src="index.js"></script>
</body>
</html>
