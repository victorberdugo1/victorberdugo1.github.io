<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>EONDRIFT</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fe8c8; font: 16px sans-serif; }
</style>
</head>
<body>
<div id="status">Cargando…</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
var Module = {
    canvas: document.getElementById("canvas"),
    setStatus: function (text) {
        var status = document.getElementById("status");
        if (text) status.textContent = text;
        else status.remove();
    }
};
</script>
<script async type="text/javascript" src="index.js"></script>
</body>
</html>
