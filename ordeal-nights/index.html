<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>OrdealNights</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#ddd;font-family:Georgia,serif}
#canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:2;transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
#bar{width:min(320px,70vw);height:3px;background:#222;margin-top:18px}
#fill{height:100%;width:0;background:#ddd}
#msg{font-size:14px;letter-spacing:.08em}
#rotate{display:none;position:fixed;inset:0;z-index:3;background:#000;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;letter-spacing:.04em}
#rotate svg{width:72px;height:72px;margin-bottom:20px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="rotate">
<svg viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
<div>Gira tu dispositivo</div>
<div style="font-size:14px;opacity:.7;margin-top:8px">Este juego está pensado para pantalla horizontal</div>
</div>
<div id="loader">
<div id="msg">Cargando…</div>
<div id="bar"><div id="fill"></div></div>
</div>
<script>
var loader=document.getElementById('loader'),msg=document.getElementById('msg'),fill=document.getElementById('fill');
var canvas=document.getElementById('canvas');
canvas.addEventListener('webglcontextlost',function(e){e.preventDefault();msg.textContent='Contexto gráfico perdido. Recarga la página.';loader.classList.remove('done')});
var Module={
  canvas:canvas,
  print:function(t){console.log(t)},
  printErr:function(t){console.warn(t)},
  setStatus:function(t){
    var m=/(\d+)\/(\d+)/.exec(t);
    if(m&&+m[2]){fill.style.width=(100*m[1]/m[2])+'%'}
    if(t)msg.textContent=m?'Cargando…':t;
  },
  monitorRunDependencies:function(left){
    if(!this.total||left>this.total)this.total=left;
    fill.style.width=(100*(this.total-left)/this.total)+'%';
  },
  onRuntimeInitialized:function(){
    fill.style.width='100%';msg.textContent='Iniciando…';
  }
};
function hideLoader(){loader.classList.add('done');canvas.focus()}
function showMessage(text){msg.textContent=text;document.getElementById('bar').style.display='none';loader.classList.remove('done')}
['keydown','mousedown','pointerdown','touchstart'].forEach(function(t){
  window.addEventListener(t,function(){document.dispatchEvent(new Event('click'))},{once:true,capture:true});
});
if(window.matchMedia('(pointer:coarse)').matches){
  var resumeAudio=function(){
    var m=window.miniaudio;
    if(!m)return;
    m.devices.forEach(function(d){
      if(d&&d.webaudio&&d.webaudio.state!=='running'&&d.state===m.device_state.started)d.webaudio.resume();
    });
  };
  ['touchend','pointerup','click'].forEach(function(t){window.addEventListener(t,resumeAudio,true)});
}
window.addEventListener('error',function(e){msg.textContent='Error: '+e.message});
</script>
<script async type="text/javascript" src="index.js"></script>
</body>
</html>
